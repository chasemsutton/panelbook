name: panelbook

services:
  prepare-data:
    build: .
    user: "0:0"
    command: ["sh", "-c", "chown -R panelbook:panelbook /data"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    network_mode: none
    healthcheck:
      disable: true
    volumes:
      - /var/panelbook/data:/data

  panelbook:
    build: .
    depends_on:
      prepare-data:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    volumes:
      - /var/panelbook/data:/data
    ports:
      - "${PANELBOOK_BIND_IP:?Set PANELBOOK_BIND_IP in .env}:8765:8765"
