name: Publish container

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version without the v prefix'
        required: true
        default: '0.5.0.5'
      publish_latest:
        description: 'Also update the latest tag (use only for the newest release)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - name: Build, smoke test, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          PUBLISH_LATEST: ${{ github.event_name == 'push' || inputs.publish_latest || false }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          app_version="${version%%-r*}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" .
          volume=panelbook-publish-smoke
          container="$(docker run -d --init --read-only --security-opt no-new-privileges:true \
            --cap-drop ALL --tmpfs /tmp:rw,nosuid,noexec,size=64m -v "$volume:/data" \
            -p 127.0.0.1:8765:8765 "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm -f "$volume" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/status > /tmp/panelbook-status.json; then break; fi
            sleep 1
          done
          python -c 'import json,sys; actual=json.load(open("/tmp/panelbook-status.json"))["version"]; assert actual==sys.argv[1], (actual,sys.argv[1])' "$app_version"
          test "$(docker exec "$container" id -u)" = 10001
          export CONTAINER_ID="$container"
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          logs = subprocess.check_output(['docker', 'logs', os.environ['CONTAINER_ID']], text=True)
          tokens = re.findall(r'First account setup code: (\S+)', logs)
          assert tokens, 'First-account setup code was not logged'
          request = urllib.request.Request(
              'http://127.0.0.1:8765/api/setup',
              data=json.dumps({'username': 'owner', 'password': 'a test-only password',
                               'setupToken': tokens[-1]}).encode(),
              headers={'Origin': 'http://127.0.0.1:8765', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              assert response.status == 201
              assert 'Secure' not in response.headers['Set-Cookie']
          PY
          docker push "$image"
          if [ "$PUBLISH_LATEST" = true ]; then
            latest="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
            docker tag "$image" "$latest"
            docker push "$latest"
          fi
