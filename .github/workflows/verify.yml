name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Server tests
        run: python -m unittest discover -s tests -q
      - name: Validate and start hosted package
        run: |
          cp .env.example .env
          sed -i 's/192.168.1.50/127.0.0.1/' .env
          docker compose config --quiet
          docker compose -f compose.pull.yaml config --quiet
          test "$(docker compose -f compose.pull.yaml config --services)" = panelbook
          sudo mkdir -p /var/panelbook/data
          sudo chown root:root /var/panelbook/data
          sudo chmod 755 /var/panelbook/data
          docker compose up -d --build --wait --wait-timeout 120
          test "$(stat -c %u /var/panelbook/data)" != 0
      - name: Check hosted status
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/api/status', timeout=2) as response:
                      status = json.load(response)
                  assert status['version'] == '0.5.0.1', status
                  assert not status['localMode'] and not status['canUseLocal'] and not status['canUpdate'], status
                  print('Hosted container is ready:', status['version'])
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise AssertionError('Hosted container did not become ready')
          PY
      - name: Verify pull-only deployment prepares root-owned data
        run: |
          image=$(docker inspect panelbook-panelbook-1 --format '{{.Image}}')
          docker tag "$image" panelbook:test
          docker compose down
          sudo chown root:root /var/panelbook/data
          sudo chmod 755 /var/panelbook/data
          export PANELBOOK_IMAGE=panelbook:test PANELBOOK_PULL_POLICY=never
          docker compose -f compose.pull.yaml up -d --wait --wait-timeout 120
          test "$(stat -c %u /var/panelbook/data)" != 0
          curl -fsS http://127.0.0.1:8765/api/status > /tmp/panelbook-pull-status.json
          python -c 'import json; assert json.load(open("/tmp/panelbook-pull-status.json"))["version"] == "0.5.0.1"'
          python - <<'PY'
          import json
          import re
          import subprocess
          import urllib.request

          logs = subprocess.check_output(
              ['docker', 'compose', '-f', 'compose.pull.yaml', 'logs', '--no-log-prefix', 'panelbook'], text=True)
          tokens = re.findall(r'First account setup code: (\S+)', logs)
          assert tokens, 'The hosted first-account setup code was not logged'
          request = urllib.request.Request(
              'http://127.0.0.1:8765/api/setup',
              data=json.dumps({'username': 'owner', 'password': 'a test-only password',
                               'setupToken': tokens[-1]}).encode(),
              headers={'Origin': 'http://127.0.0.1:8765', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              assert response.status == 201
              assert 'Secure' not in response.headers['Set-Cookie']
          PY
      - name: Validate NGINX example
        run: |
          mkdir -p "$RUNNER_TEMP/panelbook-nginx/certs"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj '/CN=panelbook.example.com' -keyout "$RUNNER_TEMP/panelbook-nginx/certs/key.pem" -out "$RUNNER_TEMP/panelbook-nginx/certs/cert.pem"
          python - <<'PY'
          from pathlib import Path
          import os
          source = Path('nginx/panelbook-site.conf.example').read_text()
          source = source.replace('/etc/letsencrypt/live/panelbook.example.com/fullchain.pem', '/certs/cert.pem')
          source = source.replace('/etc/letsencrypt/live/panelbook.example.com/privkey.pem', '/certs/key.pem')
          Path(os.environ['RUNNER_TEMP'], 'panelbook-nginx', 'site.conf').write_text(source)
          PY
          docker run --rm -v "$RUNNER_TEMP/panelbook-nginx/site.conf:/etc/nginx/conf.d/default.conf:ro" -v "$RUNNER_TEMP/panelbook-nginx/certs:/certs:ro" nginx:stable nginx -t
      - name: Container logs
        if: failure()
        run: docker compose -f compose.pull.yaml logs
      - name: Stop container
        if: always()
        run: docker compose -f compose.pull.yaml down

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build portable server
        run: python -m PyInstaller --onefile --console --name PanelbookServer program/server.py
      - name: Build branded launcher
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio C tools are unavailable.' }
          $build = 'call "' + $vs + '\VC\Auxiliary\Build\vcvars64.bat" && rc /fo dist\panelbook.res scripts\panelbook_launcher.rc && cl /nologo /W4 /O2 /std:c11 scripts\panelbook_launcher.c dist\panelbook.res /link /SUBSYSTEM:WINDOWS shell32.lib user32.lib winhttp.lib /OUT:dist\PanelbookLauncher.exe'
          cmd /c $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable release
        run: python scripts/package_release.py
      - name: Smoke test Windows launcher
        run: python tests/smoke_launcher_windows.py
      - name: Smoke test Windows updater
        run: python tests/smoke_updater_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: panelbook-v0.5.0.1
          path: dist/v0.5.0.1/*
