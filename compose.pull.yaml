# Paste this file into Arcane as the entire project Compose configuration.
# Restrict TCP 8765 with the VM/Proxmox firewall. The default public URL is
# http://VM-IP:8765/ on a trusted LAN. Set PANELBOOK_PUBLIC_SCHEME=https when
# using an HTTPS reverse proxy instead.
name: panelbook

services:
  panelbook:
    image: ${PANELBOOK_IMAGE:-ghcr.io/chasemsutton/panelbook:latest}
    pull_policy: ${PANELBOOK_PULL_POLICY:-always}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    environment:
      PANELBOOK_PUBLIC_SCHEME: "${PANELBOOK_PUBLIC_SCHEME:-http}"
    volumes:
      - /var/panelbook/data:/data
    ports:
      - "${PANELBOOK_BIND_IP:-0.0.0.0}:8765:8765"
