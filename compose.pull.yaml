# Paste this file into Arcane as the entire project Compose configuration.
# Restrict TCP 8765 with the VM/Proxmox firewall. Use the HTTPS reverse proxy
# for browser access; direct HTTP logins are disabled by secure cookies.
name: panelbook

services:
  prepare-data:
    image: ghcr.io/chasemsutton/panelbook:latest
    pull_policy: always
    user: "0:0"
    command: ["sh", "-c", "chown -R panelbook:panelbook /data"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    network_mode: none
    healthcheck:
      disable: true
    volumes:
      - /var/panelbook/data:/data

  panelbook:
    image: ghcr.io/chasemsutton/panelbook:latest
    pull_policy: always
    depends_on:
      prepare-data:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    volumes:
      - /var/panelbook/data:/data
    ports:
      - "${PANELBOOK_BIND_IP:-0.0.0.0}:8765:8765"
